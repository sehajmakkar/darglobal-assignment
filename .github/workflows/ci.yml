name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  # Superseded PR runs are cancelled; runs on main queue instead, so a push never cuts a
  # deploy short (a cancelled run left its Cloud Build orphaned, C-029).
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: Lint, types, tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.21"
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run mypy src tests
      - run: uv run pytest  # live tests are deselected by default (no quota used)
      - run: for f in scripts/*.sh; do bash -n "$f"; done

  frontend:
    name: Frontend typecheck, tests, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  docker:
    name: Docker build
    # On main the deploy job builds the image on Cloud Build; on PRs this proves it builds.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: dgbot:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to Cloud Run
    needs: [checks, frontend]
    # Keyless: GitHub's OIDC token is exchanged for short-lived GCP credentials (WIF, D-052).
    # Skipped until scripts/setup_github_wif.sh has run and its repository variables are set.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.GCP_WIF_PROVIDER != ''
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      group: deploy-cloud-run
      cancel-in-progress: false # never cut a rollout short; the next push deploys after
    permissions:
      contents: read
      id-token: write
    environment:
      name: production
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - id: deploy
        env:
          GCP_PROJECT: ${{ vars.GCP_PROJECT }}
        # pipefail + no command substitution: a failing deploy must fail this step (C-029).
        run: |
          set -o pipefail
          scripts/deploy_cloudrun.sh | tee deploy.out
          echo "url=$(tail -n 1 deploy.out)" >> "$GITHUB_OUTPUT"
      - name: Smoke test
        run: |
          # ?wait holds the request until the model has loaded (C-030)
          for i in 1 2 3; do
            curl -sf --max-time 150 "${{ steps.deploy.outputs.url }}/api/health?wait=120" \
              | grep -q '"ready":true' && exit 0
            sleep 5
          done
          echo "service did not become ready" >&2; exit 1
