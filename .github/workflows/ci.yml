name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, types, tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.21"
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run mypy src tests
      - run: uv run pytest  # live tests are deselected by default (no quota used)
      - run: bash -n scripts/deploy_cloudrun.sh

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: dgbot:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Deploy to Cloud Run on pushes to main is added in Phase 7 with Workload Identity
  # Federation (keyless auth). Until then: GCP_PROJECT=... scripts/deploy_cloudrun.sh
