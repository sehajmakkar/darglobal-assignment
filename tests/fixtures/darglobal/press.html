<!doctype html><html><head><title>DarGlobal and OMRAN Group announce partnership to develop ‘AIDA’ overlooking the Sea of Oman</title></head><body><script id="__NEXT_DATA__" type="application/json">{"page": "/press/[pressSlug]", "props": {"pageProps": {"pressDetails": {"slug": "dar-al-arkan-and-omran-group-announce-partnership-to-develop-aida-overlooking-the-sea-of-oman", "heading": "DarGlobal and OMRAN Group announce partnership to develop ‘AIDA’ overlooking the Sea of Oman", "description": "<ul><li>Project marks DarGlobal’s entry into the growing Omani market</li><li>AIDA is an ode to the glorious Sea of Oman and undisturbed nature, where high curvaceous cliffs flawlessly meet deep waters</li></ul><p style=\"text-align:justify;\">_______________________</p><p style=\"text-align:justify;\"><strong>Dubai, UAE; March 24, 2022:</strong> DarGlobal, the leading real estate company in Saudi Arabia and the GCC, and Oman Tourism Development Company (OMRAN Group) – the executive arm of the Sultanate for tourism development, have signed an agreement recently at Expo 2020 Dubai to develop ‘AIDA’, one of the largest premium, mixed-use real estate projects located in the Yiti area in Muscat.</p><p style=\"text-align:justify;\">The project marks DarGlobal’s first entry into Oman to drive the development of the property market and support the growth of Oman’s real-estate sector in accordance with Oman Vision 2040. The value of the investment in the project from both parties will reach SR6 billion, and it will be developed in three stages on an area of 3.5 million square metres.</p><p style=\"text-align:justify;\">Through the partnership, DarGlobal will develop a mixed-use project in Yiti and Yankat areas, 20-minutes from Downtown Muscat, a paradise with a distinctive terrain where the earthy atmosphere envelops as part of a large master development, situated 100m above the shores and overlooking of the Sea of Oman in Muscat, comprising of 3,500 residential units of medium-sized villas, townhouses, and low-rise apartments. A place where two charming hotels of 450 rooms, a plaza filled with cafes and restaurants, a gated promenade with luxury retail and other amenities.</p><p><img src=\"https://cdn.darglobal.co.uk/AIDA_Overview_HR_1920x920_2548a6131b.jpg\" alt=\"AIDA_Overview-HR_1920x920.jpg\"></p><p style=\"text-align:justify;\"><strong>Ziad El Chaar, Vice Chairman of DarGlobal Properties, said</strong>, “We are excited to become part of this unique project”. Oman has always offered an exceptional experience for residents and tourists, and the development of Yiti and Yankat areas will further elevate the nation’s offering and position it as a world-class destination. Our project in Oman builds on DarGlobal’s strategic aspirations of elevating the standards and quality of the real-estate sector in the region. But most importantly, with this project, we’re working to ensure a sustainable and environmentally friendly approach to building a large, mixed-use development that fits in with the characteristics of the area. AIDA sits atop one of the world’s highest peaks, a place where all the noise is quietened, composing a beautiful symphony. Overlooking one of the most breathtaking horizons in the world will lie a place bubbling with inspiration.”</p><p style=\"text-align:justify;\"><strong>Hashil Bin Obaid Al Mahrouqi, CEO of OMRAN Group, said:</strong> “We are delighted to work with DarGlobal on this master project that is being developed with world class expertise. We believe they share the same vision with regards to balanced and sustainable building practices, and this is a critical factor in the success of this project. The project is strategically designed as an extension to Muscat city to showcase the vision of progress and sustainable urbanisation. AIDA will become an attractive and sought-after destination with its many residential, entertainment, cultural, retail and recreational offerings that will put Oman on the regional and global tourism map, as well as drive foreign investment and stimulate key economic sectors that will help achieve Oman Vision 2040.”</p><p style=\"text-align:justify;\">The project is one of the largest urban developments in Oman, extending to a total area of over 11 million square kilometres. The project masterplan was designed to ensure innovative standards in urban development and place-creation, and the adoption of architectural foundations in harmony with the rich natural surroundings.</p><p style=\"text-align:justify;\">In line with the Sultanate’s ambitious plans for economic diversification, the project plays a pivotal role in increasing the contribution of the tourism sector to support the national GDP. Based on the position of OMRAN Group as the active national arm in the development of the tourism sector, the project will contribute to providing promising investment opportunities and creating a fertile environment to attract capital and foreign direct investment.</p>", "location": "DUBAI, UAE", "coverImage": "https://darglobal.co.uk/wp-content/uploads/2022/03/AIDA_Masterplan-HR_1920x920.jpg", "date": "2022-03-24", "createdAt": "2024-03-06T06:04:47.732Z", "updatedAt": "2025-04-17T10:24:21.984Z", "publishedAt": "2024-03-06T06:04:50.147Z", "cardDescription": null, "locale": "en", "SEO": {"id": 1743, "metaTitle": "DarGlobal and OMRAN Group announce partnership to develop ‘AIDA’ overlooking the Sea of Oman", "metaDescription": "DarGlobal, the leading real estate company in Saudi Arabia and the GCC, and Oman Tourism Development Company (OMRAN Group) – the executive arm of the Sultanate for tourism development, have signed an agreement recently at Expo 2020 Dubai to develop ‘AIDA’, one of the largest premium, mixed-use real estate projects located in the Yiti area in Muscat.", "keywords": null, "metaRobots": null, "structuredData": null, "metaViewport": null, "canonicalURL": null, "metaSocial": [], "metaImage": {"data": null}}}, "pressDetailsHTML": "<html><head></head><body><ul><li>Project marks DarGlobal’s entry into the growing Omani market</li><li>AIDA is an ode to the glorious Sea of Oman and undisturbed nature, where high curvaceous cliffs flawlessly meet deep waters</li></ul><p style=\"text-align:justify;\">_______________________</p><p style=\"text-align:justify;\"><strong>Dubai, UAE; March 24, 2022:</strong> DarGlobal, the leading real estate company in Saudi Arabia and the GCC, and Oman Tourism Development Company (OMRAN Group) – the executive arm of the Sultanate for tourism development, have signed an agreement recently at Expo 2020 Dubai to develop ‘AIDA’, one of the largest premium, mixed-use real estate projects located in the Yiti area in Muscat.</p><p style=\"text-align:justify;\">The project marks DarGlobal’s first entry into Oman to drive the development of the property market and support the growth of Oman’s real-estate sector in accordance with Oman Vision 2040. The value of the investment in the project from both parties will reach SR6 billion, and it will be developed in three stages on an area of 3.5 million square metres.</p><p style=\"text-align:justify;\">Through the partnership, DarGlobal will develop a mixed-use project in Yiti and Yankat areas, 20-minutes from Downtown Muscat, a paradise with a distinctive terrain where the earthy atmosphere envelops as part of a large master development, situated 100m above the shores and overlooking of the Sea of Oman in Muscat, comprising of 3,500 residential units of medium-sized villas, townhouses, and low-rise apartments. A place where two charming hotels of 450 rooms, a plaza filled with cafes and restaurants, a gated promenade with luxury retail and other amenities.</p><p><img src=\"https://cdn.darglobal.co.uk/AIDA_Overview_HR_1920x920_2548a6131b.jpg\" alt=\"AIDA_Overview-HR_1920x920.jpg\"></p><p style=\"text-align:justify;\"><strong>Ziad El Chaar, Vice Chairman of DarGlobal Properties, said</strong>, “We are excited to become part of this unique project”. Oman has always offered an exceptional experience for residents and tourists, and the development of Yiti and Yankat areas will further elevate the nation’s offering and position it as a world-class destination. Our project in Oman builds on DarGlobal’s strategic aspirations of elevating the standards and quality of the real-estate sector in the region. But most importantly, with this project, we’re working to ensure a sustainable and environmentally friendly approach to building a large, mixed-use development that fits in with the characteristics of the area. AIDA sits atop one of the world’s highest peaks, a place where all the noise is quietened, composing a beautiful symphony. Overlooking one of the most breathtaking horizons in the world will lie a place bubbling with inspiration.”</p><p style=\"text-align:justify;\"><strong>Hashil Bin Obaid Al Mahrouqi, CEO of OMRAN Group, said:</strong> “We are delighted to work with DarGlobal on this master project that is being developed with world class expertise. We believe they share the same vision with regards to balanced and sustainable building practices, and this is a critical factor in the success of this project. The project is strategically designed as an extension to Muscat city to showcase the vision of progress and sustainable urbanisation. AIDA will become an attractive and sought-after destination with its many residential, entertainment, cultural, retail and recreational offerings that will put Oman on the regional and global tourism map, as well as drive foreign investment and stimulate key economic sectors that will help achieve Oman Vision 2040.”</p><p style=\"text-align:justify;\">The project is one of the largest urban developments in Oman, extending to a total area of over 11 million square kilometres. The project masterplan was designed to ensure innovative standards in urban development and place-creation, and the adoption of architectural foundations in harmony with the rich natural surroundings.</p><p style=\"text-align:justify;\">In line with the Sultanate’s ambitious plans for economic diversification, the project plays a pivotal role in increasing the contribution of the tourism sector to support the national GDP. Based on the position of OMRAN Group as the active national arm in the development of the tourism sector, the project will contribute to providing promising investment opportunities and creating a fertile environment to attract capital and foreign direct investment.</p></body></html>", "globalData": {"menu": [{"title": "SHOULD NOT APPEAR"}]}}}}</script></body></html>
