[project]
name = "dgbot"
version = "0.1.0"
description = "RAG chatbot over public DarGlobal and Wasalt real-estate data, served via FastAPI and free OpenRouter models."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "openai>=3.55.1",
    "pydantic>=2.14.4",
    "pydantic-settings>=2.16.3",
]

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "ruff>=0.17.6",
]
scrape = [
    "playwright>=1.65.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dgbot"]

# ─── Ruff ────────────────────────────────────────────────────────────
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF", "ASYNC"]

[tool.ruff.lint.isort]
known-first-party = ["dgbot"]

# ─── Mypy ────────────────────────────────────────────────────────────
[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"

# ─── Pytest ──────────────────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra --strict-markers -m 'not live'"
markers = [
    "live: hits real external services (OpenRouter, source sites). Uses quota. Opt-in: pytest -m live",
]
